    const jx = Math.sin(t * 37) * (Math.sin(t * 5) > 0.92 ? 10 : 1.5);
    sg.font = font(900, 150); sg.textAlign = 'center'; sg.textBaseline = 'middle';
    sg.fillStyle = 'rgba(255,40,60,.5)'; sg.fillText(STRUCK_WORD, W / 2 + jx + 5, H / 2);
    sg.fillStyle = 'rgba(60,200,255,.5)'; sg.fillText(STRUCK_WORD, W / 2 + jx - 5, H / 2);
    sg.fillStyle = '#f5f5f0'; sg.fillText(STRUCK_WORD, W / 2 + jx, H / 2);
    const p = D.prog(t, 1.7, 0.6, D.ease.outCubic); const tw = sg.measureText(STRUCK_WORD).width;
    if (p > 0) { sg.strokeStyle = '#ff3b2f'; sg.lineWidth = 16; sg.lineCap = 'round'; sg.beginPath();
      sg.moveTo(W / 2 - tw / 2 - 20, H / 2 + 14); sg.lineTo(W / 2 - tw / 2 - 20 + (tw + 40) * p, H / 2 - 10 * p + 14); sg.stroke(); }
  } else if (t < 7.2) {                            // B: notifications flood
    desktopBg(); appWindow('Inbox — 99+ new');
    const n = Math.min(9, Math.floor((t - 3.6) * 3));
    for (let i = 0; i < n; i++) { rr(100, 190 + i * 56, W - 200, 46, 10, i % 2 ? '#eef2f8' : '#ffffff');
      sg.fillStyle = '#ff4a2e'; sg.beginPath(); sg.arc(126, 213 + i * 56, 8, 0, 7); sg.fill();
      sg.fillStyle = '#26314a'; sg.font = font(600, 21); sg.fillText(['how did you make this??', 'tutorial please', 'what software?', 'teach me', 'this is insane', 'guide pls', 'share the prompt!', 'is this blender?', 'HOW'][i], 146, 220 + i * 56); }
  } else if (t < 13.4) {                           // C: idle app
    desktopBg(); appWindow('skill — untitled.film');
    sg.fillStyle = '#4a5468'; sg.font = font(600, 22); sg.fillText('Describe your film', 110, 230); rr(100, 250, W - 200, 70, 10, '#fff', '#aab4c4');
    if (Math.floor(t * 2) % 2) { sg.fillStyle = '#1d2433'; sg.fillRect(124, 268, 3, 34); }
  } else if (t < 22.2) {                           // D: prompt → generate → XP → level up → render
    desktopBg(); appWindow('skill — untitled.film');
    sg.fillStyle = '#4a5468'; sg.font = font(600, 22); sg.fillText('Describe your film', 110, 230); rr(100, 250, W - 280 - 120, 70, 10, '#fff', '#aab4c4');
    const chars = Math.max(0, Math.min(PROMPT.length, Math.floor((t - 13.8) * 9)));
    sg.fillStyle = '#1d2433'; sg.font = font(500, 30, 'JetBrains Mono'); sg.fillText(PROMPT.slice(0, chars), 124, 296);
    if (chars < PROMPT.length || Math.floor(t * 2) % 2) sg.fillRect(126 + sg.measureText(PROMPT.slice(0, chars)).width, 268, 3, 34);
    const pressed = t > 15.2 && t < 15.45;
    rr(W - 290 - 10, 250 + (pressed ? 3 : 0), 200, 70, 12, pressed ? '#1b3fc0' : '#2b5cff');
    sg.fillStyle = '#fff'; sg.font = font(800, 26); sg.fillText('Generate ▶', W - 272, 294 + (pressed ? 3 : 0));
    // XP panel
    const xpIn = D.prog(t, 15.4, 0.4);
    if (xpIn > 0) { sg.globalAlpha = xpIn;
      rr(100, 350, W - 200, 270, 16, '#111520');
      sg.fillStyle = '#fff'; sg.font = font(800, 30); sg.fillText('Experience: 3D animator', 130, 405);
      const xp = Math.round(D.lerp(1000, 10000, D.prog(t, 15.7, 2.2, D.ease.inOutCubic)));
      sg.font = font(700, 24, 'JetBrains Mono'); sg.fillStyle = '#ffb347'; sg.textAlign = 'right'; sg.fillText(`${xp.toLocaleString('en-US')} / 10,000 XP`, W - 130, 405); sg.textAlign = 'left';
      rr(130, 430, W - 260, 26, 13, '#262c3b'); const gr = sg.createLinearGradient(130, 0, W - 130, 0); gr.addColorStop(0, '#ff8a2a'); gr.addColorStop(1, '#ffd24a');
      rr(130, 430, Math.max(26, (W - 260) * xp / 10000), 26, 13, gr);
      ['camera', 'light', 'motion', 'sound'].forEach((c, i) => { const on = t > 16.0 + i * 0.45; const x = 130 + i * ((W - 260) / 4);
        rr(x, 490, (W - 260) / 4 - 16, 90, 14, on ? '#ff8a2a' : '#1d2230'); sg.fillStyle = on ? '#14100a' : '#7d8597'; sg.font = font(800, 26);
        sg.textAlign = 'center'; sg.fillText(c, x + ((W - 260) / 4 - 16) / 2, 545); sg.textAlign = 'left'; });
      sg.globalAlpha = 1; }
    // level up banner
    const lv = D.prog(t, 18.0, 0.5, D.ease.outBack) * (1 - D.prog(t, 20.2, 0.3));
    if (lv > 0.01) { sg.save(); sg.translate(W / 2, 470); sg.scale(lv, lv); rr(-250, -70, 500, 140, 22, '#ffd84a'); sg.strokeStyle = '#1a1a1a'; sg.lineWidth = 6; sg.stroke();
      sg.fillStyle = '#1a1a1a'; sg.font = font(900, 72); sg.textAlign = 'center'; sg.textBaseline = 'middle'; sg.fillText('LEVEL UP', 0, 4); sg.restore(); }
    // render progress
    const rp = D.prog(t, 20.3, 1.9, D.ease.linear);
    if (rp > 0) { rr(100, 640, W - 200, 34, 10, '#111520'); rr(100, 640, (W - 200) * rp, 34, 10, '#2b5cff');
      sg.fillStyle = '#fff'; sg.font = font(700, 20, 'JetBrains Mono'); sg.fillText(`Rendering frame ${String(Math.round(rp * 870)).padStart(4, '0')} / 0870`, 118, 664); }
  } else if (t < 24.8) {                           // E: code scroll
    sg.fillStyle = '#0c1018'; sg.fillRect(0, 0, W, H); sg.font = font(500, 30, 'JetBrains Mono');
    const off = (t - 22.2) * 60;
    for (let i = 0; i < 22; i++) { const line = CODE[i % CODE.length], y = 90 + i * 52 - off; if (y < 30 || y > H) continue;
      sg.fillStyle = '#4b5568'; sg.fillText(String(i + 1).padStart(2, ' '), 40, y);
      sg.fillStyle = ['#7cc4ff', '#ffb86b', '#b6f09c', '#ff8bd1'][i % 4]; sg.fillText(line, 110, y); }
  } else {                                         // F: end card on screen
    desktopBg(); sg.fillStyle = 'rgba(255,255,255,.9)'; sg.font = font(700, 40, 'JetBrains Mono'); sg.fillText('> render complete', 90, 130);
    sg.fillStyle = '#7cc4ff'; sg.fillText('> 870 frames · 0 keyframes by hand', 90, 190);
    if (Math.floor(t * 2) % 2) { sg.fillStyle = '#fff'; sg.fillRect(90, 225, 22, 40); }
  }
  // CRT treatment: scanlines + vignette + flicker
  sg.globalAlpha = 1; sg.textAlign = 'left'; sg.textBaseline = 'alphabetic';
  sg.fillStyle = 'rgba(0,0,0,.16)'; for (let y = 0; y < H; y += 4) sg.fillRect(0, y, W, 2);
  const v = sg.createRadialGradient(W / 2, H / 2, H * 0.3, W / 2, H / 2, H * 0.85); v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,.55)');
  sg.fillStyle = v; sg.fillRect(0, 0, W, H);
  sg.fillStyle = `rgba(255,255,255,${0.02 + 0.02 * Math.sin(t * 50)})`; sg.fillRect(0, (t * 300) % H, W, 60);
  sg.restore(); screenTex.needsUpdate = true;
}

// ================================================================= SHOTS (camera)
const S = (start, end, from, to, ease = D.ease.inOutQuad) => ({ start, end, from, to, ease });
const SHOTS = [
  S(0, 3.6, { p: [0.35, 1.25, 3.5], t: [0, 1.1, -0.2] }, { p: [0.12, 1.18, 2.35], t: [0, 1.12, -0.2] }),                  // push-in on BLENDER
  S(3.6, 7.2, { p: [-1.3, 1.45, 2.7], t: [0.1, 1.1, -0.2] }, { p: [-0.7, 1.3, 2.25], t: [0.05, 1.12, -0.2] }),           // close 3/4, bubbles
  S(7.2, 10.2, { p: [3.9, 2.7, 4.6], t: [-0.5, 0.6, -0.5] }, { p: [3.2, 2.35, 3.9], t: [-0.4, 0.65, -0.5] }),            // wide establishing
  S(10.2, 13.4, { p: [-1.7, 0.32, 1.75], t: [0.2, 0.18, 0.6] }, { p: [0.7, 0.36, 1.85], t: [1.1, 0.2, 0.7] }),            // low sweep over keys
  S(13.4, 18.6, { p: [0, 1.2, 2.1], t: [0, 1.2, 0.2] }, { p: [0, 1.2, 1.32], t: [0, 1.2, 0.2] }),                        // into the screen
  S(18.6, 22.2, { orbit: [0.55, 4.4, 1.75] }, { orbit: [-0.25, 4.0, 1.55] }, D.ease.inOutQuad),         // orbit, floating words
  S(22.2, 24.8, { p: [-0.55, 0.5, 2.0], t: [-1.5, 0.2, 0.75] }, { p: [-0.9, 0.42, 1.65], t: [-1.6, 0.2, 0.7] }),          // mug + phone close-up
  S(24.8, 29, { p: [0, 1.25, 2.4], t: [0, 1.05, -0.2] }, { p: [0, 1.45, 3.6], t: [0, 1.0, -0.2] }, D.ease.outCubic),      // end pull-out
];
const tmpA = new THREE.Vector3(), tmpB = new THREE.Vector3();
function shotPose(k) { if (k.orbit) { const [a, r, h] = k.orbit; return { p: [Math.sin(a) * r, h, Math.cos(a) * r - 0.3], t: [0, 0.85, -0.3] }; } return k; }
function placeCamera(t) {
  const s = SHOTS.find(s => t < s.end) || SHOTS.at(-1);
  const p = s.ease(D.clamp((t - s.start) / (s.end - s.start)));
  const a = shotPose(s.from), b = shotPose(s.to);
  camera.position.lerpVectors(tmpA.fromArray(a.p), tmpB.fromArray(b.p), p);
  camera.lookAt(tmpA.fromArray(a.t).lerp(tmpB.fromArray(b.t), p));
  D.handheld(camera, t, 0.5);
  return s;
}

// ================================================================= OVERLAYS
D.overlay();
D.el('', 'vig');
const capEls = CAPTIONS.map(([s, e, text, hl, pos]) => {
  const el = D.el('', 'cap', pos === 'top' ? { top: V ? '13%' : '9%' } : { bottom: V ? '22%' : '9%' });
  el.innerHTML = text.split(' ').map(w => `<span class="${hl.includes(w) ? 'hl' : ''}" style="display:inline-block;white-space:pre">${w} </span>`).join('');
  return { s, e, el, spans: [...el.children] };
});
const SCREEN_C = new THREE.Vector3();
const bubbleEls = BUBBLES.map(([l, c, u, txt]) => D.el(`<div class="av" style="background:${c}">${l}</div><div><small>${u}</small>${txt}</div><span class="heart">♥</span>`, 'bubble'));
const BUB_OFF = [[-0.95, 0.2, 0.45], [0.42, 0.42, 0.45], [-1.0, -0.22, 0.5], [0.5, -0.08, 0.55], [-0.3, 0.45, 0.4]];
const floatEls = FLOAT_WORDS.map(([w]) => D.el(w, 'chrome'));
const endEl = D.el(`<div class="small">${END.above}</div><div class="chrome">${END.word}</div><div class="small">${END.below}</div>`, 'endwrap');
const grain = D.filmGrain({ opacity: 0.09 });
const fade = D.el('', 'fade');

// ================================================================= UPDATE
function update(t) {
  const shot = placeCamera(t);
  camera.updateMatrixWorld();
  // cut transition: brief blur + exposure pop at every shot start
  const q = D.clamp((t - shot.start) / 0.22);
  stage.canvas.style.filter = q < 1 && shot.start > 0 ? `blur(${(1 - q) * 9}px) brightness(${1 + (1 - q) * 0.35})` : 'none';
  fade.style.opacity = 1 - D.prog(t, 0, 0.5, D.ease.outQuad);

  dust.update(t);
  screenGlow.intensity = 1.4 + Math.sin(t * 9) * 0.08;
  led.visible = Math.floor(t * 3) % 5 !== 0;
  drawScreen(t);
  grain.update(Math.round(t * 30));

  // captions (word-by-word, ~speech pace)
  capEls.forEach(({ s, e, el, spans }) => {
    const env = D.envelope(t, s, e - s, 0.15, 0.25);
    el.style.visibility = env > 0.001 ? 'visible' : 'hidden'; el.style.opacity = env;
    const per = Math.min(0.2, (e - s) * 0.6 / spans.length);
    spans.forEach((sp, i) => { const k = D.prog(t, s + i * per, 0.22, D.ease.outCubic);
      sp.style.opacity = k; sp.style.transform = `translateY(${(1 - k) * 18}px) scale(${0.92 + 0.08 * k})`; sp.style.filter = `blur(${(1 - k) * 6}px)`; });
  });

  // chat bubbles pop out of the screen (3.9 – 7.1)
  mon.localToWorld(SCREEN_C.set(0, 0.08, 0.55));
  bubbleEls.forEach((b, i) => {
    const k = D.prog(t, 3.9 + i * 0.42, 0.45, D.ease.outBack) * (1 - D.prog(t, 6.9, 0.3));
    const o = BUB_OFF[i], drift = Math.max(0, t - 3.9 - i * 0.42) * 0.05;
    D.pinTo(b, [SCREEN_C.x + o[0] * k, SCREEN_C.y + o[1] * k + drift, SCREEN_C.z + o[2]], camera, size);
    b.style.opacity = D.clamp(k * 1.5); b.style.visibility = k > 0.01 ? 'visible' : 'hidden';
    b.style.transform = `translate(-10%, -100%) scale(${Math.max(0, k)}) rotate(${(i % 2 ? 1 : -1) * 3}deg)`;
  });

  // floating chrome words (19.0 – 22.1)
  floatEls.forEach((f, i) => {
    const k = D.prog(t, 19.0 + i * 0.45, 0.5, D.ease.outBack) * (1 - D.prog(t, 21.9, 0.3));
    const [x, y, z] = FLOAT_WORDS[i][1];
    D.pinTo(f, [x, y + Math.sin(t * 1.5 + i) * 0.04, z], camera, size);
    f.style.opacity = D.clamp(k); f.style.visibility = k > 0.01 ? 'visible' : 'hidden';
    f.style.transform = `translate(-50%, -50%) skewX(-8deg) scale(${0.6 + 0.4 * k}) translateY(${(1 - k) * 30}px)`;
  });

  // end card
  const ek = D.prog(t, 25.2, 0.6, D.ease.outBack);
  endEl.style.opacity = D.clamp(ek); endEl.style.visibility = ek > 0.01 ? 'visible' : 'hidden';
  endEl.style.transform = `translate(-50%, -50%) scale(${0.8 + 0.2 * ek})`;
}

// ================================================================= MOUNT
const fontsReady = Promise.all(["900 150px 'Inter Tight'", "800 30px 'Inter Tight'", "700 24px 'Inter Tight'", "600 22px 'Inter Tight'", "500 20px 'Inter Tight'",
  "500 30px 'JetBrains Mono'", "700 24px 'JetBrains Mono'", "700 62px Caveat"].map(f => document.fonts.load(f))).then(drawNote);
const fx = await D.postFX(stage, { strength: 0.55, radius: 0.6, threshold: 0.9 });
D.mountScene({ stage, duration: DURATION, fps: 30, update, assets: [fontsReady], render: fx.render });
</script>
