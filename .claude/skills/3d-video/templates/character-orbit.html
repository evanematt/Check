<script type="module">
import * as D from '/__skill/lib/director.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
const { THREE } = D;

// ================================================================= COPY (edit me)
const CAPTIONS = [
  // [start, end, text, highlighted words]
  [0.5, 3.6, 'Same desk. Same chair.', []],
  [9.6, 12.4, 'Day turns into night,', ['night,']],
  [12.8, 15.8, 'night into morning.', ['morning.']],
  [26.0, 29.4, 'Again and again.', ['again.']],
];
const DURATION = 30;
const CYCLE = 7.7;            // seconds per day → night → morning cycle
const PHASE0 = 0.02;          // where in the cycle t = 0 starts (0 = noon)
const TURNS = 2;              // camera orbits around the character this many times
const ORBIT = [2.6, 27.6];    // orbit runs between these times (eased in and out)

// ---- character design (from the turnaround sheet)
const LOOK = {
  skin: '#e9a688', blush: 'rgba(226,104,92,.38)', nose: '#ec9478', lips: '#c4766a',
  hair: ['#6b3820', '#7b4428', '#5c2f1a', '#8a4f2e'], brows: '#3b2216', iris: '#5b3620',
  hoodie: '#a19e99', strap: '#262120', bag: '#3a2a22',
  plaid: { base: '#1d2745', band: 'rgba(236,226,204,.62)', line: 'rgba(130,150,200,.55)', dark: 'rgba(8,12,28,.55)' },
  shoe: '#1b1b1d', sole: '#efebe2',
};

// ================================================================= STAGE
const size = D.frameSize(1920, 1080);
const V = D.isVertical(size);
if (V) document.body.classList.add('vertical');
const stage = D.createStage({ ...size, background: '#06070c', fov: V ? 60 : 36 });
const { scene, camera, renderer } = stage;
renderer.toneMappingExposure = 1.0;

const box = (w, h, d, m, x = 0, y = 0, z = 0) => { const b = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m); b.position.set(x, y, z); b.castShadow = b.receiveShadow = true; return b; };
const sph = (r, m, x = 0, y = 0, z = 0, sx = 1, sy = 1, sz = 1, seg = 32) => { const s = new THREE.Mesh(new THREE.SphereGeometry(r, seg, Math.round(seg * 0.75)), m); s.position.set(x, y, z); s.scale.set(sx, sy, sz); s.castShadow = s.receiveShadow = true; return s; };
const shadowAll = o => { o.traverse(m => { if (m.isMesh) { m.castShadow = true; m.receiveShadow = true; } }); return o; };
const UP = new THREE.Vector3(0, 1, 0);
/** cylinder from A to B (rB at B end) */
function limb(A, B, rA, rB = rA, m) {
  const a = new THREE.Vector3(...A), b = new THREE.Vector3(...B), len = a.distanceTo(b);
  const c = new THREE.Mesh(new THREE.CylinderGeometry(rB, rA, len, 24, 1), m);
  c.position.copy(a).add(b).multiplyScalar(0.5); c.quaternion.setFromUnitVectors(UP, b.clone().sub(a).normalize());
  c.castShadow = c.receiveShadow = true; return c;
}
function canvasTex(w, h, draw, repeat) {
  const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  if (repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(...repeat); }
  return t;
}

// ================================================================= TEXTURES
const plaidTex = canvasTex(512, 512, (g, w, h) => {
  const P = LOOK.plaid; g.fillStyle = P.base; g.fillRect(0, 0, w, h);
  for (const o of [0, 256]) {
    g.fillStyle = P.dark; g.fillRect(o + 150, 0, 40, h); g.fillRect(0, o + 150, w, 40);
    g.fillStyle = P.band; g.fillRect(o + 30, 0, 22, h); g.fillRect(0, o + 30, w, 22); g.fillRect(o + 62, 0, 22, h); g.fillRect(0, o + 62, w, 22);
    g.fillStyle = P.line; g.fillRect(o + 214, 0, 5, h); g.fillRect(0, o + 214, w, 5);
  }
  const r = D.rng(21); g.globalAlpha = 0.18; // twill weave
  for (let i = 0; i < 2600; i++) { g.fillStyle = r() > 0.5 ? '#000' : '#fff'; g.fillRect(r() * w, r() * h, 3, 1); }
}, [2, 2]);
const heatherTex = canvasTex(256, 256, (g, w, h) => {
  g.fillStyle = LOOK.hoodie; g.fillRect(0, 0, w, h); const img = g.getImageData(0, 0, w, h), r = D.rng(8);
  for (let i = 0; i < img.data.length; i += 4) { const n = (r() - 0.5) * 34; img.data[i] += n; img.data[i + 1] += n; img.data[i + 2] += n; }
  g.putImageData(img, 0, 0);
}, [3, 3]);
const tortoiseTex = canvasTex(256, 256, (g, w, h) => {
  g.fillStyle = '#5a2a10'; g.fillRect(0, 0, w, h); const r = D.rng(31);
  for (let i = 0; i < 90; i++) { g.fillStyle = ['#2a1308', '#3d1d0b', '#8a4a1c', '#a8622a', '#1a0c05'][i % 5]; g.globalAlpha = 0.5 + r() * 0.4;
    g.beginPath(); g.ellipse(r() * w, r() * h, 6 + r() * 18, 4 + r() * 10, r() * 3, 0, 7); g.fill(); }
}, [4, 4]);
const faceTex = canvasTex(1024, 512, (g, w, h) => {
  const sk = g.createLinearGradient(0, 0, 0, h); sk.addColorStop(0, '#e7a184'); sk.addColorStop(0.55, LOOK.skin); sk.addColorStop(1, '#dc9474');
  g.fillStyle = sk; g.fillRect(0, 0, w, h);
  const fx = w * 0.25; // front of the face (sphere u = 0.25)
  for (const s of [-1, 1]) { const gr = g.createRadialGradient(fx + s * 82, h * 0.6, 4, fx + s * 82, h * 0.6, 70); gr.addColorStop(0, LOOK.blush); gr.addColorStop(1, 'rgba(226,104,92,0)'); g.fillStyle = gr; g.fillRect(0, 0, w, h); }
  g.fillStyle = 'rgba(70,35,25,.8)'; for (const [dx, dy, r] of [[-58, 0.7, 4.5], [-50, 0.735, 3.5]]) { g.beginPath(); g.arc(fx + dx, h * dy, r, 0, 7); g.fill(); }
  const r = D.rng(4); g.fillStyle = 'rgba(150,80,55,.25)'; for (let i = 0; i < 40; i++) { g.beginPath(); g.arc(fx + (r() - 0.5) * 220, h * (0.5 + r() * 0.12), 1.5 + r() * 1.5, 0, 7); g.fill(); }
});
const strandTex = canvasTex(1024, 256, (g, w, h) => {
  g.fillStyle = '#6b3820'; g.fillRect(0, 0, w, h); const r = D.rng(14);
  for (let i = 0; i < 700; i++) { const x = r() * w; g.strokeStyle = ['#7f4628', '#5a2e18', '#93552f', '#4a2614'][i % 4]; g.globalAlpha = 0.5 + r() * 0.4; g.lineWidth = 2 + r() * 5;
    g.beginPath(); g.moveTo(x, 0); g.bezierCurveTo(x + (r() - 0.5) * 20, h * 0.4, x + (r() - 0.5) * 20, h * 0.7, x + (r() - 0.5) * 14, h); g.stroke(); }
  g.globalAlpha = 1; const gr = g.createLinearGradient(0, h * 0.75, 0, h); gr.addColorStop(0, 'rgba(30,12,4,0)'); gr.addColorStop(1, 'rgba(30,12,4,.5)'); g.fillStyle = gr; g.fillRect(0, 0, w, h);
});
const woodTex = canvasTex(1024, 1024, (g, w, h) => {
  g.fillStyle = '#6b4128'; g.fillRect(0, 0, w, h); const r = D.rng(13);
  for (let i = 0; i < 8; i++) { g.fillStyle = `hsl(${22 + r() * 8}, ${38 + r() * 10}%, ${24 + r() * 8}%)`; g.fillRect(i * 128, 0, 126, h);
    for (let k = 0; k < 40; k++) { g.strokeStyle = `rgba(30,15,8,${0.05 + r() * 0.12})`; g.lineWidth = 1 + r() * 2; g.beginPath(); const x = i * 128 + r() * 126; g.moveTo(x, 0); g.bezierCurveTo(x + 8, h * 0.3, x - 8, h * 0.7, x + r() * 6, h); g.stroke(); }
    g.fillStyle = 'rgba(0,0,0,.45)'; g.fillRect(i * 128 + 126, 0, 2, h); g.fillRect(i * 128, ((i * 397) % 1024), 126, 2); }
}, [3, 3]);
const deskTex = canvasTex(2048, 512, (g, w, h) => {
  g.fillStyle = '#5a2c18'; g.fillRect(0, 0, w, h); const r = D.rng(11);
  for (let i = 0; i < 240; i++) { const y = r() * h; g.strokeStyle = `hsla(${16 + r() * 10}, 55%, ${18 + r() * 20}%, ${0.05 + r() * 0.14})`; g.lineWidth = 1 + r() * 4; g.beginPath();
    for (let x = 0; x <= w; x += 32) g.lineTo(x, y + Math.sin(x * 0.004 + i) * 6); g.stroke(); }
});
const rugTex = canvasTex(512, 512, (g, w, h) => {
  g.fillStyle = '#7d2f24'; g.fillRect(0, 0, w, h);
  for (const [r, c] of [[250, '#d8b57a'], [235, '#7d2f24'], [200, '#2f3f5e'], [150, '#c9763e'], [120, '#7d2f24'], [70, '#d8b57a'], [50, '#2f3f5e']]) { g.fillStyle = c; g.beginPath(); g.arc(256, 256, r, 0, 7); g.fill(); }
  g.strokeStyle = 'rgba(0,0,0,.25)'; g.lineWidth = 2; for (let r = 10; r < 256; r += 9) { g.beginPath(); g.arc(256, 256, r, 0, 7); g.stroke(); }
});

// ================================================================= ROOM
const room = new THREE.Group(); scene.add(room);
const RX0 = -5.4, RX1 = 5.0, RZ0 = -3.6, RZ1 = 7.0, FY = -2.35, CY = 4.1;
const wallMat = D.mat.matte('#c9b195', { roughness: 0.95 });
const trimMat = D.mat.matte('#efe6d4', { roughness: 0.7 });
const floorM = new THREE.MeshStandardMaterial({ map: woodTex, roughness: 0.55 });
room.add(box(RX1 - RX0, 0.1, RZ1 - RZ0, floorM, (RX0 + RX1) / 2, FY - 0.05, (RZ0 + RZ1) / 2));
room.add(box(RX1 - RX0, 0.1, RZ1 - RZ0, D.mat.matte('#4a3c33'), (RX0 + RX1) / 2, CY, (RZ0 + RZ1) / 2));
// back wall with a big window: opening x WX0..WX1, y WY0..WY1
const WX0 = -3.0, WX1 = 2.2, WY0 = 0.15, WY1 = 3.0, BW = RZ0 - 0.08;
room.add(box(RX1 - RX0, WY0 - FY, 0.16, wallMat, (RX0 + RX1) / 2, (FY + WY0) / 2, BW));
room.add(box(RX1 - RX0, CY - WY1, 0.16, wallMat, (RX0 + RX1) / 2, (WY1 + CY) / 2, BW));
room.add(box(WX0 - RX0, WY1 - WY0, 0.16, wallMat, (RX0 + WX0) / 2, (WY0 + WY1) / 2, BW));
room.add(box(RX1 - WX1, WY1 - WY0, 0.16, wallMat, (WX1 + RX1) / 2, (WY0 + WY1) / 2, BW));
// window frame, mullions, sill, blinds (upper half)
room.add(box(WX1 - WX0 + 0.16, 0.08, 0.3, trimMat, (WX0 + WX1) / 2, WY0 - 0.02, BW + 0.08));
room.add(box(WX1 - WX0, 0.06, 0.08, trimMat, (WX0 + WX1) / 2, WY1, BW));
for (const x of [WX0, WX1, (WX0 + WX1) / 2]) room.add(box(0.07, WY1 - WY0, 0.1, trimMat, x, (WY0 + WY1) / 2, BW));
room.add(box(WX1 - WX0, 0.06, 0.08, trimMat, (WX0 + WX1) / 2, 1.55, BW));
const slatMat = D.mat.matte('#f1e8d6', { roughness: 0.8 });
for (let y = 1.95; y < WY1 - 0.03; y += 0.11) { const s = box(WX1 - WX0 - 0.08, 0.012, 0.09, slatMat, (WX0 + WX1) / 2, y, BW + 0.12); s.rotation.x = 0.55; room.add(s); }
room.add(box(WX1 - WX0 - 0.04, 0.06, 0.1, slatMat, (WX0 + WX1) / 2, 1.9, BW + 0.12));
// side + front walls
room.add(box(0.16, CY - FY, RZ1 - RZ0, wallMat, RX0, (FY + CY) / 2, (RZ0 + RZ1) / 2));
room.add(box(0.16, CY - FY, RZ1 - RZ0, wallMat, RX1, (FY + CY) / 2, (RZ0 + RZ1) / 2));
room.add(box(RX1 - RX0, CY - FY, 0.16, wallMat, (RX0 + RX1) / 2, (FY + CY) / 2, RZ1));
// skirting
room.add(box(0.04, 0.18, RZ1 - RZ0, trimMat, RX0 + 0.1, FY + 0.09, (RZ0 + RZ1) / 2), box(0.04, 0.18, RZ1 - RZ0, trimMat, RX1 - 0.1, FY + 0.09, (RZ0 + RZ1) / 2));
// rug
const rug = new THREE.Mesh(new THREE.CircleGeometry(2.1, 64), new THREE.MeshStandardMaterial({ map: rugTex, roughness: 0.95 }));
rug.rotation.x = -Math.PI / 2; rug.position.set(-0.4, FY + 0.012, 1.9); rug.receiveShadow = true; room.add(rug);
// bookshelf on the left wall
{ const sh = new THREE.Group(); sh.position.set(RX0 + 0.3, FY, 2.6); room.add(sh); const wd = D.mat.matte('#4a2d1d', { roughness: 0.7 });
  sh.add(box(0.45, 3.4, 0.06, wd, 0, 1.7, -1.1), box(0.45, 3.4, 0.06, wd, 0, 1.7, 1.1), box(0.05, 3.4, 2.2, wd, -0.2, 1.7, 0));
  const r = D.rng(17), cols = ['#8a3b2a', '#c8a45a', '#2f4a3a', '#d9cdb0', '#4d3a6b', '#a55a2a', '#3a5a7a', '#e0b84a'];
  for (let s = 0; s < 5; s++) { const y = 0.05 + s * 0.78; sh.add(box(0.45, 0.05, 2.2, wd, 0, y, 0));
    let z = -1.02; while (z < 0.95) { const w = 0.07 + r() * 0.07, hh = 0.42 + r() * 0.24; if (r() > 0.88) { z += 0.25; continue; }
      const b = box(0.3, hh, w, D.mat.matte(cols[Math.floor(r() * cols.length)], { roughness: 0.7 }), 0.02, y + 0.03 + hh / 2, z + w / 2); b.rotation.x = (r() - 0.5) * 0.06; sh.add(b); z += w + 0.01; } } }
// posters (right + front wall)
function poster(draw, w, h, pos, rotY) {
  const p = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshStandardMaterial({ map: canvasTex(512, Math.round(512 * h / w), draw), roughness: 0.8 }));
  p.position.set(...pos); p.rotation.y = rotY; p.receiveShadow = true; room.add(p);
}
poster((g, w, h) => { g.fillStyle = '#f0e2c4'; g.fillRect(0, 0, w, h); g.fillStyle = '#e8562e'; g.beginPath(); g.arc(w / 2, h * 0.42, w * 0.3, 0, 7); g.fill();
  g.fillStyle = '#1f3b5a'; for (let i = 0; i < 6; i++) g.fillRect(0, h * 0.5 + i * 26, w, 12); g.fillStyle = '#1f3b5a'; g.font = '900 64px Inter Tight'; g.textAlign = 'center'; g.fillText('SOFT HOURS', w / 2, h * 0.93); },
  1.5, 2.1, [RX1 - 0.09, 1.2, 2.0], -Math.PI / 2);
poster((g, w, h) => { g.fillStyle = '#16202f'; g.fillRect(0, 0, w, h); g.strokeStyle = '#7cf0a8'; g.lineWidth = 6; for (let i = 0; i < 12; i++) { g.beginPath(); g.moveTo(0, h * 0.2 + i * 40); for (let x = 0; x <= w; x += 16) g.lineTo(x, h * 0.2 + i * 40 + Math.sin(x * 0.03 + i) * 18); g.stroke(); }
  g.fillStyle = '#f2efe6'; g.font = '800 54px JetBrains Mono'; g.fillText('C:\\>RUN', 40, h * 0.9); }, 1.3, 1.7, [RX1 - 0.09, 1.3, 4.3], -Math.PI / 2);
poster((g, w, h) => { g.fillStyle = '#d8cbb0'; g.fillRect(0, 0, w, h); g.fillStyle = '#2b2b2b'; g.font = '900 120px Inter Tight'; g.fillText('NIGHT', 30, 160); g.fillText('SHIFT', 30, 280);
  g.fillStyle = '#e8562e'; g.fillRect(30, 320, w - 60, 14); }, 1.6, 2.0, [-1.0, 1.5, RZ1 - 0.09], Math.PI);
// a floor lamp + plant near the front wall
{ const pot = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.3, 0.8, 32), D.mat.matte('#c4673f', { roughness: 0.8 })); pot.position.set(3.9, FY + 0.4, 5.9); room.add(shadowAll(pot));
  const r = D.rng(6), leaf = D.mat.matte('#3d6b33', { side: THREE.DoubleSide });
  for (let i = 0; i < 16; i++) { const g = new THREE.Group(); g.position.set(3.9, FY + 0.75, 5.9); const l = sph(0.5, leaf, 0, 0.55 + r() * 0.3, 0, 0.18, 1.1 + r() * 0.5, 0.03); g.add(l);
    const a = i / 16 * 6.28 + r(); g.rotation.set(Math.sin(a) * (0.3 + r() * 0.5), a, Math.cos(a) * (0.3 + r() * 0.5)); room.add(g); } }

// ================================================================= OUTSIDE (sky, sun, moon, skyline, stars)
const skyMat = new THREE.ShaderMaterial({ toneMapped: false, depthWrite: false,
  uniforms: { top: { value: new THREE.Color() }, bot: { value: new THREE.Color() }, k: { value: 1 } },
  vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.); }',
  fragmentShader: 'uniform vec3 top; uniform vec3 bot; uniform float k; varying vec2 vUv; void main(){ gl_FragColor = vec4(mix(bot, top, smoothstep(0.2, 0.85, vUv.y)) * k, 1.); }' });
const sky = new THREE.Mesh(new THREE.PlaneGeometry(60, 30), skyMat); sky.position.set(0, 3, -16); scene.add(sky);
const starPos = []; { const r = D.rng(41); for (let i = 0; i < 380; i++) starPos.push((r() - 0.5) * 50, -1 + r() * 17, -15.8); }
const starGeo = new THREE.BufferGeometry(); starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starPos, 3));
const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({ color: '#dfe8ff', size: 0.07, transparent: true, toneMapped: false })); scene.add(stars);
const sunDisc = new THREE.Mesh(new THREE.CircleGeometry(0.9, 48), new THREE.MeshBasicMaterial({ color: '#fff1d0', toneMapped: false, transparent: true })); scene.add(sunDisc);
const moonDisc = new THREE.Mesh(new THREE.CircleGeometry(0.55, 48), new THREE.MeshBasicMaterial({ color: '#e6ecff', toneMapped: false, transparent: true })); scene.add(moonDisc);
// skyline: silhouettes + lit windows
const skyW = 40, skyH = 7;
const bldTex = canvasTex(2048, 360, (g, w, h) => { const r = D.rng(52); let x = 0; g.fillStyle = '#fff';
  while (x < w) { const bw = 60 + r() * 140, bh = 80 + r() * 260; g.fillRect(x, h - bh, bw, bh); if (r() > 0.7) g.fillRect(x + bw * 0.4, h - bh - 30, 6, 30); x += bw + r() * 10; } });
const winTex = canvasTex(2048, 360, (g, w, h) => { const r = D.rng(52); let x = 0;
  while (x < w) { const bw = 60 + r() * 140, bh = 80 + r() * 260; for (let yy = h - bh + 14; yy < h - 10; yy += 22) for (let xx = x + 10; xx < x + bw - 12; xx += 18) if (r() > 0.62) { g.fillStyle = r() > 0.3 ? '#ffd88a' : '#9fd0ff'; g.fillRect(xx, yy, 8, 11); }
    if (r() > 0.7) r(); x += bw + r() * 10; } });
const skyline = new THREE.Mesh(new THREE.PlaneGeometry(skyW, skyH), new THREE.MeshBasicMaterial({ alphaMap: bldTex, transparent: true, color: '#556', toneMapped: false })); skyline.position.set(0, -1.0, -12); scene.add(skyline);
const cityLights = new THREE.Mesh(new THREE.PlaneGeometry(skyW, skyH), new THREE.MeshBasicMaterial({ map: winTex, transparent: true, blending: THREE.AdditiveBlending, toneMapped: false, depthWrite: false })); cityLights.position.set(0, -1.0, -11.98); scene.add(cityLights);

// ================================================================= DESK + RETRO PC
const DESK = { x0: -2.4, x1: 2.0, z0: -1.5, z1: 0.95 };
const desk = new THREE.Group(); scene.add(desk);
const deskMat = new THREE.MeshPhysicalMaterial({ map: deskTex, roughness: 0.4, clearcoat: 0.4, clearcoatRoughness: 0.4 });

  const smokeCol = new THREE.Color('#e9e6e1').lerp(new THREE.Color('#8794b8'), night).lerp(new THREE.Color('#ffb98a'), lampOn * 0.25);
  // rising stream from the tip
  const life = STREAM_LIFE, dt = life / STREAM.length;
  STREAM.forEach((s, i) => { const age = ((t - i * dt) % life + life) % life, u = age / life;
    const sw = Math.sin(age * 1.9 + i * 1.3) * 0.07 * age, sw2 = Math.cos(age * 1.4 + i * 0.7) * 0.06 * age;
    s.position.set(tip.x + sw + age * 0.05, tip.y + 0.02 + age * 0.42 - age * age * 0.02, tip.z + sw2);
    const k = 0.05 + age * 0.2; s.scale.set(k, k * 1.3, 1); s.material.rotation = i + age * 0.6;
    s.material.opacity = Math.min(1, age / 0.25) * (1 - u) ** 1.6 * 0.38; s.material.color.copy(smokeCol); });
  // exhaled puffs from the mouth
  mouthW.set(0, -0.21, 0.42); head.localToWorld(mouthW);
  fwd.set(0, -0.2, 1).applyQuaternion(head.getWorldQuaternion(new THREE.Quaternion())).normalize();
  const e = EXHALES.filter(e => e <= t).pop(), age = e === undefined ? 99 : t - e;
  PUFF.forEach((s, i) => { const [dx, dy, dz, d0] = puffDir[i];
    if (age > PUFF_LIFE) { s.material.opacity = 0; return; }
    const reach = (1 - Math.exp(-2.4 * age)) * (0.35 + d0 * 0.35);
    s.position.copy(mouthW).addScaledVector(fwd, reach); s.position.x += dx * age * 0.35; s.position.y += age * 0.16 + dy * age * 0.2; s.position.z += dz * age * 0.35;
    const k = 0.1 + age * 0.45; s.scale.set(k, k, 1); s.material.rotation = i * 2 + age;
    s.material.opacity = Math.min(1, age / 0.1) * (1 - age / PUFF_LIFE) ** 1.5 * 0.32; s.material.color.copy(smokeCol); });

  // --- PC
  drawScreen(t);
  screenGlow.intensity = (1.0 + night * 1.4) * (1 + Math.sin(t * 9) * 0.04);
  led.visible = Math.floor(t * 3) % 5 !== 0;
  dust.update(t); dust.points.material.opacity = 0.7 * (1 - night * 0.7);

  // --- camera
  placeCamera(t);
  if (DBG.has('ang')) { const a = +DBG.get('ang'), r = +(DBG.get('r') || 2.6), hp = headW(), ty = +(DBG.get('ty') || hp.y - 0.4);
    camera.position.set(hp.x + Math.sin(a) * r, ty + +(DBG.get('dy') || 0.1), hp.z + Math.cos(a) * r); camera.lookAt(hp.x, ty, hp.z); }
  if (DBG.has('hide')) for (const n of DBG.get('hide').split(',')) ({ pc, props, desk, room, smoke: { visible: 0 } })[n].visible = false;
  if (DBG.get('hide')?.includes('smoke')) [...STREAM, ...PUFF].forEach(s => s.visible = false);
  if (DBG.has('bright')) { hemi.intensity = 2.2; hemi.color.set('#ffffff'); hemi.groundColor.set('#888'); }
  camera.updateMatrixWorld();

  // --- overlays
  grain.update(Math.round(t * 30));
  fade.style.opacity = Math.max(1 - D.prog(t, 0, 0.6, D.ease.outQuad), D.prog(t, DURATION - 0.6, 0.6, D.ease.inQuad));
  capEls.forEach(({ s, e, el, spans }) => {
    const env = D.envelope(t, s, e - s, 0.15, 0.3); el.style.visibility = env > 0.001 ? 'visible' : 'hidden'; el.style.opacity = env;
    const per = Math.min(0.2, (e - s) * 0.6 / spans.length);
    spans.forEach((sp, i) => { const k = D.prog(t, s + i * per, 0.22, D.ease.outCubic); sp.style.opacity = k; sp.style.transform = `translateY(${(1 - k) * 18}px) scale(${0.92 + 0.08 * k})`; sp.style.filter = `blur(${(1 - k) * 6}px)`; });
  });
  const hrs = hoursAt(t), h24 = Math.floor(hrs % 24), mm = Math.floor((hrs % 1) * 60);
  clkDay.textContent = `DAY ${Math.floor((hrs - 12) / 24 + (h24 < 12 ? 0 : 0)) + 1 + (h24 < 12 && hrs >= 24 ? 0 : 0)}`;
  clkDay.textContent = `DAY ${Math.floor(hrs / 24) + 1}`;
  clkTime.textContent = `${String((h24 + 11) % 12 + 1).padStart(2, '0')}:${String(mm).padStart(2, '0')} ${h24 < 12 ? 'AM' : 'PM'}`;
  clkIco.style.background = isMoon || night > 0.5 ? 'radial-gradient(circle at 35% 35%, #f3f5ff 0 55%, transparent 56%), radial-gradient(circle at 62% 40%, transparent 0 48%, #e6ecff 49%)' : '#ffc45a';
  clkIco.style.boxShadow = isMoon || night > 0.5 ? '0 0 14px rgba(200,215,255,.6)' : '0 0 16px rgba(255,190,90,.8)';
  if (isMoon || night > 0.5) clkIco.style.background = 'radial-gradient(circle at 65% 35%, transparent 0 42%, #e9eeff 43%)';
  clock.style.opacity = D.prog(t, 0.6, 0.6) * (1 - D.prog(t, DURATION - 0.8, 0.5));
}

// ================================================================= MOUNT
const fontsReady = Promise.all(["700 34px 'JetBrains Mono'", "800 54px 'JetBrains Mono'", "900 64px 'Inter Tight'", "800 64px 'Inter Tight'"].map(f => document.fonts.load(f)));
const fx = await D.postFX(stage, { strength: 0.5, radius: 0.6, threshold: 0.92 });
D.mountScene({ stage, duration: DURATION, fps: 30, update, assets: [fontsReady], render: fx.render });
</script>
</body>
</html>
