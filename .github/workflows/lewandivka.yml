name: Lewandivka CI

# Builds and tests the Fabric mod «Левандівка: по той бік району» (directory lewandivka/).
#   1. core unit tests (pure Java, no Minecraft)
#   2. Loom build: compiles and remaps the mod against Minecraft 1.20.1
#   3. Fabric GameTests on a headless dedicated server (registries, both dimensions, structures, campaign)
#   4. static resource validation
# Logs of every run are attached to the pre-release "ci-latest" so they can be read without opening the Actions UI.
on:
  push:
    branches: ['claude/determined-clarke-eigmli']
    paths:
      - 'lewandivka/**'
      - '.github/workflows/lewandivka.yml'
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish the built artifacts as a GitHub pre-release'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: lewandivka-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: lewandivka
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: gradle/actions/setup-gradle@v4

      - name: Prepare log folder
        run: mkdir -p ../logs

      - name: Core unit tests (pure Java, no Minecraft)
        run: ./gradlew -p core test --console=plain 2>&1 | tee ../logs/core-test.txt

      - name: Compile and remap the mod
        if: always()
        run: ./gradlew build --console=plain 2>&1 | tee ../logs/compile.txt

      - name: Fabric GameTests (headless dedicated server)
        if: always()
        timeout-minutes: 25
        run: |
          mkdir -p build/gametest
          echo "eula=true" > build/gametest/eula.txt
          ./gradlew runGametest --console=plain 2>&1 | tee ../logs/gametest.txt

      - name: Dedicated server smoke test (fresh world, both dimensions, rcon)
        if: always()
        timeout-minutes: 20
        run: bash tools/ci/smoke.sh ../logs/server.txt 2>&1 | tee ../logs/smoke.txt

      - name: Static resource validation
        if: always()
        run: |
          python3 -m pip install --quiet pillow numpy
          python3 tools/validate_resources.py 2>&1 | tee ../logs/validate.txt

      - name: Upload jar
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lewandivka-jar
          path: lewandivka/build/libs/*.jar
          if-no-files-found: ignore

      - name: Publish logs to the pre-release ci-latest
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$GITHUB_WORKSPACE"
          rm -rf ci-out && mkdir -p ci-out
          cp logs/*.txt logs/*.rcon ci-out/ 2>/dev/null || true
          cp lewandivka/build/junit.xml ci-out/ 2>/dev/null || true
          (cd lewandivka/build/gametest && tar czf "$GITHUB_WORKSPACE/ci-out/gametest-run.tgz" logs crash-reports 2>/dev/null) || true
          cp lewandivka/build/libs/lewandivka-*[0-9].jar ci-out/lewandivka-ci.jar 2>/dev/null || true
          echo "run=${{ github.run_number }} sha=${{ github.sha }} job-status=${{ job.status }}" > ci-out/info.txt
          gh release view ci-latest >/dev/null 2>&1 || gh release create ci-latest --prerelease --title "CI logs (latest run)" --notes "Automatic logs of the most recent CI run of the Lewandivka mod." --target "$GITHUB_SHA"
          gh release upload ci-latest ci-out/* --clobber
