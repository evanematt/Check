name: Lewandivka CI

# Builds and tests the Fabric mod «Левандівка: по той бік району» (directory lewandivka/).
# Everything that can be verified without Minecraft (core tests, static resource validation) runs first,
# then the Loom build compiles and remaps the jar against Minecraft 1.20.1.
on:
  push:
    branches: ['claude/determined-clarke-eigmli']
    paths:
      - 'lewandivka/**'
      - '.github/workflows/lewandivka.yml'
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish the built artifacts as a GitHub pre-release'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: lewandivka-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: lewandivka
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: gradle/actions/setup-gradle@v4

      - name: Prepare log folder
        run: mkdir -p ../logs

      - name: Core unit tests (pure Java, no Minecraft)
        run: ./gradlew -p core test --console=plain 2>&1 | tee ../logs/core-test.txt

      - name: Compile and remap the mod
        if: always()
        run: ./gradlew build --console=plain 2>&1 | tee ../logs/compile.txt

      - name: Fabric GameTests (headless dedicated server)
        if: always()
        timeout-minutes: 25
        run: |
          mkdir -p build/gametest
          echo "eula=true" > build/gametest/eula.txt
          ./gradlew runGametest --console=plain 2>&1 | tee ../logs/gametest.txt

      - name: Static resource validation
        if: always()
        run: |
          python3 -m pip install --quiet pillow numpy
          python3 tools/validate_resources.py

      - name: Digest of problems
        if: always()
        run: |
          for f in core-test compile gametest; do
            if [ -f "../logs/$f.txt" ]; then
              echo "=== $f ==="
              grep -nE "error:|: error|FAILED|What went wrong|Caused by|Exception|\[ERROR\]|/ERROR\]|Failed to|Could not|Crash|crash|Test .* failed|passed|GameTest" "../logs/$f.txt" | grep -v "at org.gradle\|at java.base" | cut -c1-260 | head -70
            fi
          done
          if [ -f build/junit.xml ]; then
            echo "=== junit.xml ==="
            python3 - <<'PY'
          import re
          s = open("build/junit.xml", encoding="utf-8").read()
          print(re.findall(r"<testsuite[^>]*>", s)[:1])
          for m in re.finditer(r'<testcase name="([^"]+)"[^>]*?(/>|>(.*?)</testcase>)', s, re.S):
              body = m.group(3) or ""
              print(("FAIL " if "<failure" in body or "<error" in body else "ok   ") + m.group(1), re.sub(r"\s+", " ", body)[:300])
          PY
          fi

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            lewandivka/core/build/reports
            lewandivka/build/reports
            lewandivka/build/junit.xml
            logs
            lewandivka/build/gametest/logs
            lewandivka/build/gametest/crash-reports
          if-no-files-found: ignore

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: lewandivka-jar
          path: |
            lewandivka/build/libs/*.jar
