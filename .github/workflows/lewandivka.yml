name: Lewandivka CI

# Builds and tests the Fabric mod «Левандівка: по той бік району» (directory lewandivka/).
#   1. core unit tests (pure Java, no Minecraft)
#   2. Loom build: compiles and remaps the mod against Minecraft 1.20.1
#   3. Fabric GameTests on a headless dedicated server (registries, both dimensions, structures, campaign)
#   4. static resource validation
#   5. modpack: .mrpack, server pack (booted and validated), TLauncher installer, THIRD_PARTY.md
# The real client test (Xvfb, software OpenGL, joins a dedicated server, tours both dimensions, plays the physical parts)
# takes half an hour and lives in its own workflow, lewandivka-client.yml, so that a new push does not cancel it.
# The jobs "server" and "package" run side by side. The logs of every job are attached to the pre-release "ci-latest"
# (info-server.txt / info-package.txt say which commit they belong to) so they can be read without opening the Actions UI.
on:
  push:
    branches: ['claude/determined-clarke-eigmli']
    paths:
      - 'lewandivka/**'
      - '.github/workflows/lewandivka.yml'
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish the built artifacts as a GitHub pre-release'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: lewandivka-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------- unit tests, build, GameTests, dedicated server
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: lewandivka
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: gradle/actions/setup-gradle@v4

      - name: Prepare log folder
        run: mkdir -p ../logs

      - name: Core unit tests (pure Java, no Minecraft)
        run: ./gradlew -p core test --console=plain 2>&1 | tee ../logs/core-test.txt; exit ${PIPESTATUS[0]}

      - name: Compile and remap the mod
        if: always()
        run: ./gradlew build --console=plain 2>&1 | tee ../logs/compile.txt; exit ${PIPESTATUS[0]}

      - name: Decompile the vanilla classes that matter (reading material, not a check)
        if: always()
        continue-on-error: true
        timeout-minutes: 10
        run: bash tools/ci/decompile.sh ../logs/vanilla-src 2>&1 | tee ../logs/decompile.txt

      - name: Fabric GameTests (headless dedicated server)
        if: always()
        timeout-minutes: 25
        run: |
          mkdir -p build/gametest
          echo "eula=true" > build/gametest/eula.txt
          ./gradlew runGametest --console=plain 2>&1 | tee ../logs/gametest.txt; exit ${PIPESTATUS[0]}

      - name: Dedicated server smoke test (fresh world, both dimensions, rcon)
        id: smoke
        if: always()
        timeout-minutes: 30
        run: bash tools/ci/smoke.sh ../logs/server.txt 2>&1 | tee ../logs/smoke.txt; exit ${PIPESTATUS[0]}

      - name: Static resource validation
        if: always()
        run: |
          python3 -m pip install --quiet pillow numpy
          python3 tools/validate_resources.py 2>&1 | tee ../logs/validate.txt; exit ${PIPESTATUS[0]}

      - name: Upload jar
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lewandivka-jar
          path: lewandivka/build/libs/*.jar
          if-no-files-found: ignore

      - name: Publish the logs to the pre-release ci-latest
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$GITHUB_WORKSPACE"
          rm -rf ci-out && mkdir -p ci-out
          cp logs/*.txt logs/*.rcon logs/vanilla-src.tgz ci-out/ 2>/dev/null || true
          cp lewandivka/build/junit.xml ci-out/ 2>/dev/null || true
          (cd lewandivka/build/gametest && tar czf "$GITHUB_WORKSPACE/ci-out/gametest-run.tgz" logs crash-reports 2>/dev/null) || true
          cp lewandivka/build/libs/lewandivka-*[0-9].jar ci-out/lewandivka-ci.jar 2>/dev/null || true
          echo "run=${{ github.run_number }} sha=${{ github.sha }} job-status=${{ job.status }} state=final" > ci-out/info-server.txt
          find ci-out -type f -empty -delete          # GitHub refuses empty release assets and aborts the whole upload
          gh release view ci-latest >/dev/null 2>&1 || gh release create ci-latest --prerelease --title "CI logs (latest run)" --notes "Automatic logs of the most recent CI run of the Lewandivka mod." --target "$GITHUB_SHA"
          # the file that says which commit the logs belong to goes last: whoever waits for it finds the rest already there
          # an upload that is still running from the partial publisher, or a hiccup of the server, must not lose the whole publication
          for i in $(seq 1 30); do pgrep -f "gh release upload" >/dev/null || break; sleep 2; done
          upload() { for i in 1 2 3 4; do gh release upload ci-latest "$@" --clobber && return 0; sleep 6; done; return 1; }
          upload $(find ci-out -type f ! -name 'info-*')
          upload ci-out/info-*.txt

  # ---------------------------------------------------------------- the modpack, the server pack, the installer
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: lewandivka
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: gradle/actions/setup-gradle@v4

      - name: Prepare log folder
        run: mkdir -p ../logs

      - name: Build the mod
        run: ./gradlew build --console=plain 2>&1 | tee ../logs/package-build.txt; exit ${PIPESTATUS[0]}

      - name: Package the modpack (mrpack, server pack, TLauncher installer, THIRD_PARTY.md)
        id: package
        run: |
          mkdir -p ../dist
          python3 tools/modpack/build_modpack.py --jar "$(ls build/libs/lewandivka-*[0-9].jar | head -1)" --out ../dist 2>&1 | tee ../logs/package.txt; exit ${PIPESTATUS[0]}

      - name: Boot the finished server pack
        if: always() && steps.package.outcome == 'success'
        timeout-minutes: 20
        run: bash tools/ci/serverpack-smoke.sh "../dist/Lewandivka-Server-1.0.0.zip" ../logs/serverpack.txt tools/ci/rcon.py 2>&1 | tee ../logs/serverpack-result.txt; exit ${PIPESTATUS[0]}

      - name: Publish the logs and the files to the pre-release ci-latest
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$GITHUB_WORKSPACE"
          rm -rf ci-out && mkdir -p ci-out
          cp logs/package*.txt logs/serverpack*.txt logs/serverpack*.rcon ci-out/ 2>/dev/null || true
          cp dist/* ci-out/ 2>/dev/null || true
          echo "run=${{ github.run_number }} sha=${{ github.sha }} job-status=${{ job.status }} state=final package=${{ steps.package.outcome }}" > ci-out/info-package.txt
          find ci-out -type f -empty -delete
          gh release view ci-latest >/dev/null 2>&1 || gh release create ci-latest --prerelease --title "CI logs (latest run)" --notes "Automatic logs of the most recent CI run of the Lewandivka mod." --target "$GITHUB_SHA"
          # the file that says which commit the logs belong to goes last: whoever waits for it finds the rest already there
          # an upload that is still running from the partial publisher, or a hiccup of the server, must not lose the whole publication
          for i in $(seq 1 30); do pgrep -f "gh release upload" >/dev/null || break; sleep 2; done
          upload() { for i in 1 2 3 4; do gh release upload ci-latest "$@" --clobber && return 0; sleep 6; done; return 1; }
          upload $(find ci-out -type f ! -name 'info-*')
          upload ci-out/info-*.txt

      # A manual run with "release" ticked, or a push whose commit message contains [release]: the finished files as a
      # GitHub pre-release v1.0.0 (the README links to it).
      - name: Publish the release v1.0.0 (only when asked for)
        if: steps.package.outcome == 'success' && ((github.event_name == 'workflow_dispatch' && inputs.release) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[release]')))
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$GITHUB_WORKSPACE"
          mkdir -p release-out
          cp dist/lewandivka-1.0.0.jar dist/Lewandivka-1.0.0.mrpack dist/Lewandivka-Server-1.0.0.zip dist/Lewandivka-TLauncher-Installer-1.0.0.zip dist/THIRD_PARTY.md release-out/
          cp lewandivka/README.md release-out/README.md
          cat > release-notes.md <<'NOTES'
          Cooperative Fabric 1.20.1 adventure for 1-3 players (Ukrainian first, English included).

          * `Lewandivka-TLauncher-Installer-1.0.0.zip` - TLauncher: unzip, double-click `install.bat` (Windows) or run `install.sh`, pick `fabric-loader-0.16.10-1.20.1`
          * `Lewandivka-1.0.0.mrpack` - Modrinth App, Prism Launcher, MultiMC, ATLauncher
          * `Lewandivka-Server-1.0.0.zip` - dedicated server (offline mode for TLauncher accounts)
          * `lewandivka-1.0.0.jar` - the mod alone (needs Fabric API and GeckoLib, see the README)
          * `THIRD_PARTY.md` - every third-party project, license and version

          Every file was built and tested by CI (unit tests, GameTests, dedicated server, real client, finished server pack).
          NOTES
          gh release delete v1.0.0 --yes --cleanup-tag >/dev/null 2>&1 || true
          gh release create v1.0.0 release-out/* --prerelease --title "Левандівка: по той бік району 1.0.0" --notes-file release-notes.md --target "$GITHUB_SHA"
