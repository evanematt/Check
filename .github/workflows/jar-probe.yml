name: Jar probe

# One-off diagnostics: what monobank's public jar endpoints return, and whether a browser may call them directly.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Look at the responses
        run: |
          python3 - <<'PY'
          import json, secrets, urllib.request
          H = {"User-Agent": "Mozilla/5.0", "Accept": "application/json", "Content-Type": "application/json",
               "Origin": "https://send.monobank.ua", "Referer": "https://send.monobank.ua/jar/5bq8BQsJbc"}
          def req(url, body=None):
              r = urllib.request.Request(url, data=json.dumps(body).encode() if body else None, headers=H, method="POST" if body else "GET")
              with urllib.request.urlopen(r, timeout=20) as x: return json.load(x)
          def show(name, d):
              red = {k: ("<hidden>" if k.lower() in ("iban", "ps") else v) for k, v in d.items()}
              print(name, json.dumps(red, ensure_ascii=False)[:3000])
          h = req("https://send.monobank.ua/api/handler", {"c": "hello", "clientId": "5bq8BQsJbc", "Pc": secrets.token_hex(16)})
          show("HANDLER", h)
          ext = h.get("extJarId")
          for url in [f"https://api.monobank.ua/bank/jar/{ext}"]:
              try: show("JAR " + url.split('/')[-1][:6], req(url))
              except Exception as e: print("JAR error", e)
          PY
      - name: Can a browser on github.io call them?
        run: |
          for u in "https://api.monobank.ua/bank/jar/x" ; do
            echo "== $u"; curl -sS -o /dev/null -D - -H "Origin: https://evanematt.github.io" "$u" | grep -i -E "^HTTP|access-control" || true
          done
          echo "== handler preflight"
          curl -sS -o /dev/null -D - -X OPTIONS -H "Origin: https://evanematt.github.io" -H "Access-Control-Request-Method: POST" -H "Access-Control-Request-Headers: content-type" https://send.monobank.ua/api/handler | grep -i -E "^HTTP|access-control" || true
