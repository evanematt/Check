name: Build Lewandivka mod

on:
  push:
    paths:
      - 'lewandivka-mod/**'
      - '.github/workflows/build-mod.yml'
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish artifacts as a GitHub release'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lewandivka-mod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        run: chmod +x gradlew && ./gradlew build --stacktrace
      - name: Build modpack (mrpack, server, TLauncher)
        run: |
          JAR=$(ls build/libs/lewandivka-*[0-9].jar | head -n1)
          python3 tools/build_pack.py "$JAR" dist || echo "pack build failed (see log)"
          cp "$JAR" dist/ 2>/dev/null || (mkdir -p dist && cp "$JAR" dist/)
          cat dist/pack_report.txt 2>/dev/null || true
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lewandivka-dist
          path: |
            lewandivka-mod/dist/*.jar
            lewandivka-mod/dist/*.mrpack
            lewandivka-mod/dist/*.zip
            lewandivka-mod/dist/*.md
            lewandivka-mod/dist/*.txt
      - name: Release
        if: github.event_name == 'workflow_dispatch' && inputs.release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: lewandivka-build-${{ github.run_number }}
          name: Левандівка мод (build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          files: |
            lewandivka-mod/dist/*.jar
            lewandivka-mod/dist/*.mrpack
            lewandivka-mod/dist/*.zip
            lewandivka-mod/dist/THIRD_PARTY.md
            lewandivka-mod/dist/pack_report.txt
          body: |
            Левандівка: по той бік району (Minecraft Java 1.20.1, Fabric).
            - `Lewandivka-TLauncher-*.zip` — для TLauncher: розпакувати в .minecraft (інструкція всередині).
            - `Lewandivka-*.mrpack` — для Modrinth App / Prism.
            - `Lewandivka-Server-*.zip` — виділений сервер.
            - `lewandivka-*.jar` — лише мод (потрібен Fabric API окремо).
