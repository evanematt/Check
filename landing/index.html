<!doctype html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Намалюй мені рись</title>
  <meta name="theme-color" content="#060a1f" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Unbounded:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="preload" as="image" href="assets/hero-bg.webp" imagesrcset="assets/hero-bg-768.webp 768w, assets/hero-bg.webp 1344w" imagesizes="100vw" />
  <link rel="preload" as="fetch" href="assets/book.glb" crossorigin />
  <link rel="stylesheet" href="styles.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <header class="site-header">
    <nav class="site-nav" aria-label="Головна навігація">
      <a class="site-logo" href="#" aria-label="Roboneers × СЕНС — на головну">
        <img src="assets/logos-roboneers-sens.png" alt="Roboneers × СЕНС" width="387" height="33" />
      </a>
      <ul class="site-links">
        <li><a href="#">Про проєкт</a></li>
        <li><a href="#">Розмальовка</a></li>
        <li><a href="#">Як допомогти</a></li>
      </ul>
      <a class="site-cta" href="#">Купити</a>
    </nav>
  </header>

  <main>
    <section class="hero" aria-label="Намалюй мені рись">
      <!-- everything visual lives in .scene, which gets the gentle distortion; the card and its focus target stay crisp -->
      <div class="scene">
      <picture class="hero-bg" aria-hidden="true">
        <source media="(max-width: 768px)" srcset="assets/hero-bg-768.webp" />
        <img src="assets/hero-bg.webp" alt="" width="1344" height="896" fetchpriority="high" />
      </picture>

      <!-- living layers on top of the painting -->
      <div class="hero-star" aria-hidden="true"></div>
      <div class="hero-aurora" aria-hidden="true"></div>
      <canvas class="hero-sparkles" aria-hidden="true"></canvas>
      <div class="hero-shade" aria-hidden="true"></div>

      <!-- ground robot with the lynx riding in the back; the lynx's gaze follows the cursor -->
      <svg class="defs" width="0" height="0" aria-hidden="true">
        <!-- slow, subtle heat-haze over the whole scene (animated by nrk.js) -->
        <filter id="warp" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
          <feTurbulence id="warpNoise" type="fractalNoise" baseFrequency="0.006 0.018" numOctaves="2" seed="7" result="noise" />
          <feDisplacementMap in="SourceGraphic" in2="noise" scale="7" xChannelSelector="R" yChannelSelector="G" />
        </filter>
        <filter id="moonlit" color-interpolation-filters="sRGB">
          <feColorMatrix type="matrix" values="0.40 0.05 0.03 0 0  0.03 0.48 0.08 0 0  0.07 0.12 0.80 0 0.035  0 0 0 1 0" />
        </filter>
      </svg>
      <!-- warm light the garland throws onto the snow and painting around the robot -->
      <div class="nrk-spill" aria-hidden="true"><canvas></canvas></div>
      <div class="nrk" role="img" aria-label="Наземний роботизований комплекс у снігу, у кузові сидить рись і стежить за курсором">
        <div class="nrk-shadow"></div>
        <div class="nrk-body">
          <img src="assets/nrk-base.webp" alt="" width="1274" height="1517" />
          <svg class="nrk-garland" id="nrkGarlandBack" viewBox="0 0 1274 1517" preserveAspectRatio="none" aria-hidden="true"></svg>
          <div class="nrk-lynx" id="nrkLynx"></div>
          <img src="assets/nrk-front.webp" alt="" width="1274" height="1517" />
          <canvas class="nrk-light" aria-hidden="true"></canvas>
          <svg class="nrk-garland" id="nrkGarlandFront" viewBox="0 0 1274 1517" preserveAspectRatio="none" aria-hidden="true"></svg>
        </div>
        <canvas class="nrk-snow"></canvas>
      </div>

      <!-- the colouring book, half buried in the snow -->
      <canvas class="book-scene" aria-hidden="true"></canvas>
      </div>

      <!-- keyboard / screen-reader access to the same info -->
      <button class="book-hit" type="button" aria-controls="bookCard" aria-expanded="false">
        <span class="visually-hidden">Розмальовка «Намалюй мені рись» — показати інформацію</span>
      </button>

      <aside class="book-card" id="bookCard" role="dialog" aria-labelledby="bookCardTitle" hidden>
        <h2 class="book-card-title" id="bookCardTitle">
          <img src="assets/book-card-title.svg" alt="Розмальовка «Намалюй мені рись»" width="688" height="162" />
        </h2>
        <p class="book-card-text">Текст-заглушка. Тут буде короткий опис розмальовки: про що вона, для кого і куди підуть кошти з кожного примірника.</p>
        <div class="book-card-actions">
          <a class="book-card-btn book-card-btn--ghost" href="#">Спробувати</a>
          <a class="book-card-btn book-card-btn--solid" href="#">Купити</a>
        </div>
      </aside>
    </section>
  </main>

  <script src="main.js" defer></script>
  <script src="nrk.js" defer></script>
  <script type="module" src="book.js"></script>
</body>
</html>
