<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <title>Shader Studio</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23fff' stroke-width='2' stroke-linejoin='round'%3E%3Cpath d='M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="app" id="app">
    <header class="topbar" id="topbar"></header>

    <aside class="styles-panel" id="stylesPanel" aria-label="Styles"></aside>

    <main class="stage" id="stage">
      <div class="canvas-wrap" id="canvasWrap"><canvas id="canvas" aria-label="Image preview"></canvas></div>
      <div class="badge" id="stageBadge" title="Source image size"></div>
      <div class="badge compare" id="compareBadge" hidden>Original</div>
      <div class="drop-overlay" id="dropOverlay" hidden><span>Drop an image to load it</span></div>
      <nav class="dock" id="dock" aria-label="Actions"></nav>
    </main>

    <aside class="controls-panel" id="controlsPanel" aria-label="Controls"></aside>
  </div>

  <input type="file" id="fileInput" accept="image/*" hidden />
  <noscript><p class="fatal">Shader Studio needs JavaScript and WebGL2.</p></noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
