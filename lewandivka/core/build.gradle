plugins {
    id 'java-library'
}

group = 'com.lewandivka'
version = '1.0.0'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
    options.compilerArgs << '-Xlint:all' << '-Xlint:-serial'
}

tasks.named('test') {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
        showStandardStreams = false
        exceptionFormat = 'full'
    }
    // The structure catalog tests build every blueprint of the game (some are large).
    maxHeapSize = '1g'
}

// Development aid: gradle render -Pids=garage13 -Pslices=9,10 -Pscale=6
tasks.register('render', JavaExec) {
    group = 'verification'
    description = 'Renders blueprints to PNG (build/renders)'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.lewandivka.core.tools.RenderMain'
    systemProperty 'java.awt.headless', 'true'
    ['ids', 'slices', 'scale', 'out', 'cut', 'cutview'].each { k ->
        if (project.hasProperty(k)) {
            systemProperty k, project.property(k)
        }
    }
}
